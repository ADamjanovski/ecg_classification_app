[project]
name = "backend"
version = "0.1.0"
description = "Backend for chat app for classifying ECG signals"
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "fastapi==0.136.3",
    "minio==7.2.20",
    "motor==3.7.1",
    "numpy==2.4.6",
    "pydantic-settings==2.14.1",
    "pymongo==4.17.0",
    "python-multipart==0.0.32",
    "scikit-learn==1.9.0",
    "torch==2.12.0",
    "tqdm==4.68.1",
    "uvicorn==0.49.0",
    "wfdb==4.3.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true